{% extends "base.html" %}

{% block title %}入库单管理 - 仓库管理系统{% endblock %}

{% block content %}
<div class="page-header">
    <h1>入库单管理</h1>
    <div class="page-actions">
        {% if has_perm('in_order', 'edit') %}<a href="/in-orders/new" class="btn btn-primary">新建入库单</a>{% endif %}
    </div>
</div>

<div class="filter-bar">
    <select id="status-filter" onchange="loadOrders()">
        <option value="">全部状态</option>
        <option value="pending">待审核</option>
        <option value="approved">已审核</option>
    </select>
    <span>入库日期</span>
    <input type="date" id="start-date">
    <input type="date" id="end-date">
    <button onclick="setThisMonth()" class="btn btn-sm">本月</button>
    <button onclick="setLastMonth()" class="btn btn-sm">上月</button>
    <select id="per-page" onchange="loadOrders()">
        <option value="15">15条/页</option>
        <option value="50">50条/页</option>
        <option value="100">100条/页</option>
    </select>
    <button onclick="loadOrders()" class="btn btn-secondary">搜索</button>
</div>

<div class="data-table">
    <table>
        <thead>
            <tr>
                <th>单据编号</th>
                <th>供应商</th>
                <th>经手人</th>
                <th>入库日期</th>
                <th>用途</th>
                <th>操作员</th>
                <th>状态</th>
                <th>创建时间</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody id="orders-tbody"></tbody>
    </table>
</div>

<div class="pagination" id="pagination"></div>
{% endblock %}

{% block scripts %}
<script>
let currentPage = 1;
let initialLoad = true; // 标记是否为首次加载

function saveFilterState() {
    // 首次加载时不保存（避免保存空过滤条件）
    if (initialLoad) return;

    const state = {
        status: document.getElementById('status-filter').value,
        startDate: document.getElementById('start-date').value,
        endDate: document.getElementById('end-date').value,
        perPage: document.getElementById('per-page').value,
        currentPage: currentPage
    };
    sessionStorage.setItem('inOrderFilter', JSON.stringify(state));
}

function restoreFilterState() {
    const saved = sessionStorage.getItem('inOrderFilter');
    if (!saved) {
        initialLoad = false;
        return;
    }

    const state = JSON.parse(saved);
    document.getElementById('status-filter').value = state.status || '';
    document.getElementById('start-date').value = state.startDate || '';
    document.getElementById('end-date').value = state.endDate || '';
    document.getElementById('per-page').value = state.perPage || '15';

    currentPage = state.currentPage || 1;
    loadOrders(currentPage);
    initialLoad = false;
}

async function loadOrders(page = 1) {
    currentPage = page;
    const status = document.getElementById('status-filter').value;
    const startDate = document.getElementById('start-date').value;
    const endDate = document.getElementById('end-date').value;
    const perPage = document.getElementById('per-page').value;

    saveFilterState();

    const params = new URLSearchParams({ page, per_page: perPage });
    if (status) params.append('status', status);
    if (startDate) params.append('start_date', startDate);
    if (endDate) params.append('end_date', endDate);

    const data = await apiRequest(`/in-orders?${params}`);
    renderOrders(data.items);
    renderPagination('pagination', data.total, data.page, perPage, loadOrders);
}

function renderOrders(orders) {
    const tbody = document.getElementById('orders-tbody');
    if (orders.length === 0) {
        tbody.innerHTML = '<tr><td colspan="9">暂无数据</td></tr>';
        return;
    }
    tbody.innerHTML = orders.map(o => `
        <tr>
            <td><a href="/in-orders/${escapeHtml(o.id)}/detail">${escapeHtml(o.order_no)}</a></td>
            <td>${escapeHtml(o.supplier_name)}</td>
            <td>${escapeHtml(o.receiver)}</td>
            <td>${escapeHtml(o.receiver_date)}</td>
            <td>${escapeHtml(o.purpose)}</td>
            <td>${escapeHtml(o.operator_name)}</td>
            <td><span class="status ${escapeHtml(o.status)}">${getStatusText(o.status)}</span></td>
            <td>${escapeHtml(o.created_at)}</td>
            <td>
                ${o.status === 'pending' ? `
                    ${hasPerm('in_order', 'edit') ? `<a href="/in-orders/${escapeHtml(o.id)}/edit" class="btn btn-sm">编辑</a>` : ''}
                    ${hasPerm('in_order', 'approve') ? `<button onclick="approveOrder(${escapeHtml(o.id)})" class="btn btn-sm btn-success approve-btn">审核</button>` : ''}
                    ${hasPerm('in_order', 'edit') ? `<button onclick="deleteOrder(${escapeHtml(o.id)})" class="btn btn-sm btn-danger">删除</button>` : ''}
                ` : ''}
            </td>
        </tr>
    `).join('');
}

function getStatusText(status) {
    const map = { pending: '待审核', approved: '已审核' };
    return map[status] || escapeHtml(status);
}

async function approveOrder(id) {
    if (!hasPerm('in_order', 'approve')) {
        alert('无审核权限');
        return;
    }
    if (!confirm('确定要审核通过该入库单吗？')) return;
    await apiRequest(`/in-orders/${id}/approve`, { method: 'POST' });
    alert('审核成功');
    loadOrders(currentPage);
}

async function deleteOrder(id) {
    if (!hasPerm('in_order', 'edit')) {
        alert('无删除权限');
        return;
    }
    if (!confirm('确定要删除该入库单吗？')) return;
    await apiRequest(`/in-orders/${id}`, { method: 'DELETE' });
    alert('删除成功');
    loadOrders(currentPage);
}

initDateRange('start-date', 'end-date', loadOrders);
if (sessionStorage.getItem('inOrderFilter')) {
    restoreFilterState();
} else {
    setThisMonth();
    initialLoad = false;
}
</script>
{% endblock %}
