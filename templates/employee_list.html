{% extends "base.html" %}

{% block title %}员工管理 - 仓库管理系统{% endblock %}

{% block content %}
<div class="page-header">
    <h1>员工管理</h1>
    <div class="page-actions">
        {% if has_perm('employee', 'edit') %}<a href="/employees/new" class="btn btn-primary" id="add-btn">新增员工</a>{% endif %}
    </div>
</div>

<div class="filter-bar">
    <input type="text" id="search-keyword" placeholder="搜索员工姓名、部门、电话">
    <select id="per-page" onchange="loadEmployees()">
        <option value="15">15条/页</option>
        <option value="50">50条/页</option>
        <option value="100">100条/页</option>
    </select>
    <button onclick="loadEmployees()" class="btn btn-secondary">搜索</button>
</div>

<div class="data-table">
    <table>
        <thead>
            <tr>
                <th>姓名</th>
                <th>部门</th>
                <th>电话</th>
                <th>备注</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody id="employees-tbody"></tbody>
    </table>
</div>

<div class="pagination" id="pagination"></div>
{% endblock %}

{% block scripts %}
<script>
let currentPage = 1;
let initialLoad = true; // 标记是否为首次加载

function saveFilterState() {
    // 首次加载时不保存（避免保存空过滤条件）
    if (initialLoad) return;

    const state = {
        keyword: document.getElementById('search-keyword').value,
        perPage: document.getElementById('per-page').value,
        currentPage: currentPage
    };
    sessionStorage.setItem('employeeFilter', JSON.stringify(state));
}

function restoreFilterState() {
    const saved = sessionStorage.getItem('employeeFilter');
    if (!saved) {
        initialLoad = false;
        return;
    }

    const state = JSON.parse(saved);
    document.getElementById('search-keyword').value = state.keyword || '';
    document.getElementById('per-page').value = state.perPage || '15';
    currentPage = state.currentPage || 1;
    loadEmployees(currentPage);
    initialLoad = false;
}

async function loadEmployees(page = 1) {
    currentPage = page;
    const keyword = document.getElementById('search-keyword').value;
    const perPage = document.getElementById('per-page').value;

    saveFilterState();

    const params = new URLSearchParams({ page, per_page: perPage });
    if (keyword) params.append('keyword', keyword);

    const data = await apiRequest(`/employees?${params}`);
    renderEmployees(data.items);
    renderPagination('pagination', data.total, data.page, perPage, loadEmployees);
}

function renderEmployees(employees) {
    const tbody = document.getElementById('employees-tbody');
    if (employees.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5">暂无数据</td></tr>';
        return;
    }
    tbody.innerHTML = employees.map(e => `
        <tr>
            <td>${escapeHtml(e.name)}</td>
            <td>${escapeHtml(e.department)}</td>
            <td>${escapeHtml(e.phone)}</td>
            <td>${escapeHtml(e.remark)}</td>
            <td>
                ${hasPerm('employee', 'edit') ? `<a href="/employees/${escapeHtml(e.id)}/edit" class="btn btn-sm">编辑</a>` : ''}
                ${hasPerm('employee', 'edit') ? `<button onclick="deleteEmployee(${escapeHtml(e.id)})" class="btn btn-sm btn-danger">删除</button>` : ''}
            </td>
        </tr>
    `).join('');
}

async function deleteEmployee(id) {
    if (!hasPerm('employee', 'edit')) {
        alert('无删除权限');
        return;
    }
    if (!confirm('确定要删除该员工吗？')) return;
    await apiRequest(`/employees/${id}`, { method: 'DELETE' });
    loadEmployees(currentPage);
}

loadEmployees().then(() => {
    restoreFilterState();
});
</script>
{% endblock %}
