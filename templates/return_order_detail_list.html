{% extends "base.html" %}

{% block title %}退库台账 - 仓库管理系统{% endblock %}

{% block content %}
<div class="page-header">
    <h1>退库台账</h1>
</div>

<div class="filter-bar">
    <select id="status-filter" onchange="loadOrders()">
        <option value="">全部状态</option>
        <option value="pending">待审核</option>
        <option value="approved">已审核</option>
    </select>
    <span>退库日期</span>
    <input type="date" id="start-date">
    <input type="date" id="end-date">
    <button onclick="setThisMonth()" class="btn btn-sm">本月</button>
    <button onclick="setLastMonth()" class="btn btn-sm">上月</button>
    <input type="text" id="out-order-no" placeholder="关联出库单号">
    <input type="text" id="search-keyword" placeholder="搜索物料编码、名称、品牌、规格">
    <button onclick="resetFilter()" class="btn btn-secondary">重置</button>
    <select id="per-page" onchange="loadOrders()">
        <option value="15" selected>15条/页</option>
        <option value="50">50条/页</option>
        <option value="100">100条/页</option>
    </select>
    <button onclick="loadOrders()" class="btn btn-secondary">搜索</button>
</div>

<div class="data-table">
    <table>
        <thead>
            <tr>
                <th>退库单号</th>
                <th>关联出库单</th>
                <th>部门</th>
                <th>退库人</th>
                <th>退库日期</th>
                <th>物料编码</th>
                <th>品牌</th>
                <th>物料名称</th>
                <th>批次号</th>
                <th>退回数量</th>
                <th>退回毛重</th>
                <th>实际净用量</th>
                <th>状态</th>
            </tr>
        </thead>
        <tbody id="orders-tbody"></tbody>
    </table>
</div>

<div class="pagination" id="pagination"></div>
{% endblock %}

{% block scripts %}
<script>
let currentPage = 1;
let initialLoad = true; // 标记是否为首次加载

async function loadOrders(page = 1) {
    currentPage = page;
    const status = document.getElementById('status-filter').value;
    const startDate = document.getElementById('start-date').value;
    const endDate = document.getElementById('end-date').value;
    const outOrderNo = document.getElementById('out-order-no').value.trim();
    const keyword = document.getElementById('search-keyword').value.trim();
    const perPage = document.getElementById('per-page').value;

    saveFilterState();

    const params = new URLSearchParams({ page, per_page: perPage });
    if (status) params.append('status', status);
    if (startDate) params.append('start_date', startDate);
    if (endDate) params.append('end_date', endDate);
    if (outOrderNo) params.append('out_order_no', outOrderNo);
    if (keyword) params.append('keyword', keyword);

    const data = await apiRequest(`/return-orders?${params}`);
    if (data) {
        renderOrders(data.items);
        renderPagination('pagination', data.total, data.page, perPage, loadOrders);
    }
}

function renderOrders(orders) {
    const tbody = document.getElementById('orders-tbody');
    if (orders.length === 0) {
        tbody.innerHTML = '<tr><td colspan="13">暂无数据</td></tr>';
        return;
    }

    let html = '';
    orders.forEach(o => {
        if (!o.items || o.items.length === 0) {
            html += `<tr>
                <td><a href="/return-orders/${escapeHtml(o.order_id)}/detail">${escapeHtml(o.order_no)}</a></td>
                <td>${escapeHtml(o.out_order_no)}</td>
                <td>${escapeHtml(o.department)}</td>
                <td>${escapeHtml(o.receiver)}</td>
                <td>${escapeHtml(o.receiver_date)}</td>
                <td colspan="7"></td>
                <td><span class="status ${escapeHtml(o.status)}">${getStatusText(o.status)}</span></td>
            </tr>`;
        } else {
            o.items.forEach((item, idx) => {
                if (idx === 0) {
                    html += `<tr>
                        <td rowspan="${o.items.length}"><a href="/return-orders/${escapeHtml(o.order_id)}/detail">${escapeHtml(o.order_no)}</a></td>
                        <td rowspan="${o.items.length}">${escapeHtml(o.out_order_no)}</td>
                        <td rowspan="${o.items.length}">${escapeHtml(o.department)}</td>
                        <td rowspan="${o.items.length}">${escapeHtml(o.receiver)}</td>
                        <td rowspan="${o.items.length}">${escapeHtml(o.receiver_date)}</td>
                        <td>${escapeHtml(item.material_code)}</td>
                        <td>${escapeHtml(item.manufacturer)}</td>
                        <td>${escapeHtml(item.material_name)}</td>
                        <td>${escapeHtml(item.batch_no)}</td>
                        <td>${item.quantity != null ? Number(item.quantity).toFixed(2) : ''}</td>
                        <td>${item.return_gross_weight != null ? Number(item.return_gross_weight).toFixed(2) : ''}</td>
                        <td>${item.actual_net_weight != null ? Number(item.actual_net_weight).toFixed(2) : ''}</td>
                        <td rowspan="${o.items.length}"><span class="status ${escapeHtml(o.status)}">${getStatusText(o.status)}</span></td>
                    </tr>`;
                } else {
                    html += `<tr>
                        <td>${escapeHtml(item.material_code)}</td>
                        <td>${escapeHtml(item.manufacturer)}</td>
                        <td>${escapeHtml(item.material_name)}</td>
                        <td>${escapeHtml(item.batch_no)}</td>
                        <td>${item.quantity != null ? Number(item.quantity).toFixed(2) : ''}</td>
                        <td>${item.return_gross_weight != null ? Number(item.return_gross_weight).toFixed(2) : ''}</td>
                        <td>${item.actual_net_weight != null ? Number(item.actual_net_weight).toFixed(2) : ''}</td>
                    </tr>`;
                }
            });
        }
    });
    tbody.innerHTML = html;
}

function getStatusText(status) {
    const map = {
        pending: '待审核',
        approved: '已审核'
    };
    return map[status] || escapeHtml(status);
}

function saveFilterState() {
    // 首次加载时不保存（避免保存空过滤条件）
    if (initialLoad) return;

    const state = {
        status: document.getElementById('status-filter').value,
        startDate: document.getElementById('start-date').value,
        endDate: document.getElementById('end-date').value,
        outOrderNo: document.getElementById('out-order-no').value,
        keyword: document.getElementById('search-keyword').value,
        perPage: document.getElementById('per-page').value,
        currentPage: currentPage
    };
    sessionStorage.setItem('returnOrderDetailFilter', JSON.stringify(state));
}

function restoreFilterState() {
    const saved = sessionStorage.getItem('returnOrderDetailFilter');
    if (!saved) {
        initialLoad = false;
        return;
    }

    const state = JSON.parse(saved);
    document.getElementById('status-filter').value = state.status || '';
    document.getElementById('start-date').value = state.startDate || '';
    document.getElementById('end-date').value = state.endDate || '';
    document.getElementById('out-order-no').value = state.outOrderNo || '';
    document.getElementById('search-keyword').value = state.keyword || '';
    document.getElementById('per-page').value = state.perPage || '15';

    currentPage = state.currentPage || 1;
    loadOrders(currentPage);
    initialLoad = false;
}

initDateRange('start-date', 'end-date', loadOrders);
if (sessionStorage.getItem('returnOrderDetailFilter')) {
    restoreFilterState();
} else {
    setThisMonth();
    loadOrders();
    initialLoad = false;
}

function resetFilter() {
    sessionStorage.removeItem('returnOrderDetailFilter');
    window.location.href = '/return-order-details';
}
</script>
{% endblock %}
