{% extends "base.html" %}

{% block title %}出库台账 - 仓库管理系统{% endblock %}

{% block content %}
<div class="page-header">
    <h1>出库台账</h1>
    <button onclick="exportExcel()" class="btn btn-primary">导出Excel</button>
</div>

<div class="filter-bar">
    <select id="status-filter" onchange="loadOrders()">
        <option value="">全部状态</option>
        <option value="pending">待审核</option>
        <option value="approved">已审核</option>
    </select>
    <select id="receiver-filter" onchange="loadOrders()">
        <option value="">全部领用人</option>
    </select>
    <span>出库日期</span>
    <input type="date" id="start-date" placeholder="开始日期">
    <input type="date" id="end-date" placeholder="结束日期">
    <button onclick="setThisMonth()" class="btn btn-sm">本月</button>
    <button onclick="setLastMonth()" class="btn btn-sm">上月</button>
    <input type="text" id="search-keyword" placeholder="搜索物料编码、名称、品牌、规格">
    <button onclick="resetFilter()" class="btn btn-secondary">重置</button>
    <select id="per-page" onchange="loadOrders()">
        <option value="15" selected>15条/页</option>
        <option value="50">50条/页</option>
        <option value="100">100条/页</option>
    </select>
    <button onclick="loadOrders()" class="btn btn-secondary">搜索</button>
</div>

<div class="data-table">
    <table>
        <thead>
            <tr>
                <th>部门</th>
                <th>领用人</th>
                <th>用途</th>
                <th>出库日期</th>
                <th>物料编码</th>
                <th>物料名称</th>
                <th>品牌</th>
                <th>规格型号</th>
                <th>单位</th>
                <th>批次号</th>
                <th>实际用量</th>
                <th>领用毛重</th>
                <th>状态</th>
            </tr>
        </thead>
        <tbody id="orders-tbody"></tbody>
    </table>
</div>
<div class="data-table-summary">
    <span>本页合计：<strong id="page-total">0</strong></span>&nbsp;&nbsp;
    <span>总计：<strong id="grand-total">0</strong></span>
</div>

<style>
.data-table-summary { margin-top: 8px; text-align: right; color: #666; }
.data-table-summary strong { color: #333; }
</style>

<div class="pagination" id="pagination"></div>
{% endblock %}

{% block scripts %}
<script>
let currentPage = 1;
let initialLoad = true; // 标记是否为首次加载
let savedReceiverValue = null; // 领用人下拉异步加载后恢复

async function loadOrders(page = 1) {
    currentPage = page;
    const status = document.getElementById('status-filter').value;
    const receiver = document.getElementById('receiver-filter').value;
    const startDate = document.getElementById('start-date').value;
    const endDate = document.getElementById('end-date').value;
    const keyword = document.getElementById('search-keyword').value.trim();
    const perPage = document.getElementById('per-page').value;

    saveFilterState();

    const params = new URLSearchParams({ page, per_page: perPage });
    if (status) params.append('status', status);
    if (receiver) params.append('receiver', receiver);
    if (startDate) params.append('start_date', startDate);
    if (endDate) params.append('end_date', endDate);
    if (keyword) params.append('keyword', keyword);

    const data = await apiRequest(`/out-orders/detail?${params}`);
    if (data) {
        document.getElementById('page-total').textContent = '0';
        document.getElementById('grand-total').textContent = Number(data.grand_total || 0).toFixed(2);
        renderOrders(data.items);
        renderPagination('pagination', data.total, data.page, perPage, loadOrders);
    }
}

function exportExcel() {
    const status = document.getElementById('status-filter').value;
    const receiver = document.getElementById('receiver-filter').value;
    const startDate = document.getElementById('start-date').value;
    const endDate = document.getElementById('end-date').value;
    const keyword = document.getElementById('search-keyword').value.trim();

    const params = new URLSearchParams();
    if (status) params.append('status', status);
    if (receiver) params.append('receiver', receiver);
    if (startDate) params.append('start_date', startDate);
    if (endDate) params.append('end_date', endDate);
    if (keyword) params.append('keyword', keyword);

    window.location.href = '/api/out-orders/detail/export?' + params.toString();
}

function saveFilterState() {
    // 首次加载时不保存（避免保存空过滤条件）
    if (initialLoad) return;

    const state = {
        status: document.getElementById('status-filter').value,
        receiver: document.getElementById('receiver-filter').value,
        startDate: document.getElementById('start-date').value,
        endDate: document.getElementById('end-date').value,
        keyword: document.getElementById('search-keyword').value,
        perPage: document.getElementById('per-page').value,
        currentPage: currentPage
    };
    sessionStorage.setItem('outOrderDetailFilter', JSON.stringify(state));
}

function restoreFilterState() {
    const saved = sessionStorage.getItem('outOrderDetailFilter');
    if (!saved) {
        initialLoad = false;
        return;
    }

    const state = JSON.parse(saved);
    document.getElementById('status-filter').value = state.status || '';
    document.getElementById('start-date').value = state.startDate || '';
    document.getElementById('end-date').value = state.endDate || '';
    document.getElementById('search-keyword').value = state.keyword || '';
    document.getElementById('per-page').value = state.perPage || '15';
    savedReceiverValue = state.receiver || '';

    currentPage = state.currentPage || 1;
    initialLoad = false;
}

initDateRange('start-date', 'end-date', loadOrders);

async function loadReceivers() {
    try {
        const data = await apiRequest('/employees');
        if (data) {
            const select = document.getElementById('receiver-filter');
            data.items.forEach(e => {
                select.innerHTML += '<option value="' + escapeHtml(e.name) + '">' + escapeHtml(e.name) + '</option>';
            });
        }
    } catch (e) {
        // 领用人加载失败不阻断筛选恢复
    }
    if (savedReceiverValue !== null) {
        document.getElementById('receiver-filter').value = savedReceiverValue;
        savedReceiverValue = null;
        loadOrders(currentPage);
    }
}

function resetFilter() {
    sessionStorage.removeItem('outOrderDetailFilter');
    window.location.href = '/out-order-details';
}

function renderOrders(orders) {
    const tbody = document.getElementById('orders-tbody');
    if (orders.length === 0) {
        tbody.innerHTML = '<tr><td colspan="13">暂无数据</td></tr>';
        document.getElementById('page-total').textContent = '0';
        document.getElementById('grand-total').textContent = '0';
        return;
    }

    let html = '';
    orders.forEach(o => {
        if (!o.items || o.items.length === 0) {
            html += `<tr>
                <td>${escapeHtml(o.department)}</td>
                <td>${escapeHtml(o.receiver)}</td>
                <td>${escapeHtml(o.purpose)}</td>
                <td>${escapeHtml(o.receiver_date)}</td>
                <td colspan="4"></td>
                <td></td>
                <td><span class="status ${escapeHtml(o.status)}">${getStatusText(o.status)}</span></td>
            </tr>`;
        } else {
            o.items.forEach((item, idx) => {
                if (idx === 0) {
                    html += `<tr>
                        <td rowspan="${o.items.length}">${escapeHtml(o.department)}</td>
                        <td rowspan="${o.items.length}">${escapeHtml(o.receiver)}</td>
                        <td rowspan="${o.items.length}">${escapeHtml(o.purpose)}</td>
                        <td rowspan="${o.items.length}">${escapeHtml(o.receiver_date)}</td>
                        <td>${escapeHtml(item.material_code)}</td>
                        <td>${escapeHtml(item.material_name)}</td>
                        <td>${escapeHtml(item.manufacturer)}</td>
                        <td>${escapeHtml(item.spec)}</td>
                        <td>${escapeHtml(item.unit)}</td>
                        <td>${escapeHtml(item.batch_no)}</td>
                        <td>${item.actual_quantity != null ? Number(item.actual_quantity).toFixed(2) : '0.00'}</td>
                        <td>${item.initial_gross_weight != null ? Number(item.initial_gross_weight).toFixed(2) : ''}</td>
                        <td rowspan="${o.items.length}"><span class="status ${escapeHtml(o.status)}">${getStatusText(o.status)}</span></td>
                    </tr>`;
                } else {
                    html += `<tr>
                        <td>${escapeHtml(item.material_code)}</td>
                        <td>${escapeHtml(item.material_name)}</td>
                        <td>${escapeHtml(item.manufacturer)}</td>
                        <td>${escapeHtml(item.spec)}</td>
                        <td>${escapeHtml(item.unit)}</td>
                        <td>${escapeHtml(item.batch_no)}</td>
                        <td>${item.actual_quantity != null ? Number(item.actual_quantity).toFixed(2) : '0.00'}</td>
                        <td>${item.initial_gross_weight != null ? Number(item.initial_gross_weight).toFixed(2) : ''}</td>
                    </tr>`;
                }
            });
        }
    });
    tbody.innerHTML = html;

    let totalActualQty = 0;
    orders.forEach(o => {
        (o.items || []).forEach(item => {
            totalActualQty += parseFloat(item.actual_quantity) || 0;
        });
    });
    document.getElementById('page-total').textContent = totalActualQty.toFixed(2);
}

function getStatusText(status) {
    const map = {
        pending: '待审核',
        approved: '已审核',
        completed: '已完成'
    };
    return map[status] || escapeHtml(status);
}

if (sessionStorage.getItem('outOrderDetailFilter')) {
    restoreFilterState();
} else {
    setThisMonth();
    initialLoad = false;
}
loadReceivers();
</script>
{% endblock %}
