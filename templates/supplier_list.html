{% extends "base.html" %}

{% block title %}供应商管理 - 仓库管理系统{% endblock %}

{% block content %}
<div class="page-header">
    <h1>供应商管理</h1>
    <div class="page-actions">
        {% if has_perm('supplier', 'edit') %}<a href="/suppliers/new" class="btn btn-primary" id="add-btn">新增供应商</a>{% endif %}
    </div>
</div>

<div class="filter-bar">
    <input type="text" id="search-keyword" placeholder="搜索供应商名称、联系人、电话">
    <select id="per-page" onchange="loadSuppliers()">
        <option value="15">15条/页</option>
        <option value="50">50条/页</option>
        <option value="100">100条/页</option>
    </select>
    <button onclick="loadSuppliers()" class="btn btn-secondary">搜索</button>
</div>

<div class="data-table">
    <table>
        <thead>
            <tr>
                <th>供应商名称</th>
                <th>联系人</th>
                <th>电话</th>
                <th>地址</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody id="suppliers-tbody"></tbody>
    </table>
</div>

<div class="pagination" id="pagination"></div>
{% endblock %}

{% block scripts %}
<script>
let currentPage = 1;
let initialLoad = true; // 标记是否为首次加载

function saveFilterState() {
    // 首次加载时不保存（避免保存空过滤条件）
    if (initialLoad) return;

    const state = {
        keyword: document.getElementById('search-keyword').value,
        perPage: document.getElementById('per-page').value,
        currentPage: currentPage
    };
    sessionStorage.setItem('supplierFilter', JSON.stringify(state));
}

function restoreFilterState() {
    const saved = sessionStorage.getItem('supplierFilter');
    if (!saved) {
        initialLoad = false;
        return;
    }

    const state = JSON.parse(saved);
    document.getElementById('search-keyword').value = state.keyword || '';
    document.getElementById('per-page').value = state.perPage || '15';
    currentPage = state.currentPage || 1;
    loadSuppliers(currentPage);
    initialLoad = false;
}

async function loadSuppliers(page = 1) {
    currentPage = page;
    const keyword = document.getElementById('search-keyword').value;
    const perPage = document.getElementById('per-page').value;

    saveFilterState();

    const params = new URLSearchParams({ page, per_page: perPage });
    if (keyword) params.append('keyword', keyword);

    const data = await apiRequest(`/suppliers?${params}`);
    renderSuppliers(data.items);
    renderPagination('pagination', data.total, data.page, perPage, loadSuppliers);
}

function renderSuppliers(suppliers) {
    const tbody = document.getElementById('suppliers-tbody');
    if (suppliers.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5">暂无数据</td></tr>';
        return;
    }
    tbody.innerHTML = suppliers.map(s => `
        <tr>
            <td>${escapeHtml(s.name)}</td>
            <td>${escapeHtml(s.contact)}</td>
            <td>${escapeHtml(s.phone)}</td>
            <td>${escapeHtml(s.address)}</td>
            <td>
                ${hasPerm('supplier', 'edit') ? `<a href="/suppliers/${escapeHtml(s.id)}/edit" class="btn btn-sm">编辑</a>` : ''}
                ${hasPerm('supplier', 'edit') ? `<button onclick="deleteSupplier(${escapeHtml(s.id)})" class="btn btn-sm btn-danger">删除</button>` : ''}
            </td>
        </tr>
    `).join('');
}

async function deleteSupplier(id) {
    if (!hasPerm('supplier', 'edit')) {
        alert('无删除权限');
        return;
    }
    if (!confirm('确定要删除该供应商吗？')) return;
    await apiRequest(`/suppliers/${id}`, { method: 'DELETE' });
    loadSuppliers(currentPage);
}

loadSuppliers().then(() => {
    restoreFilterState();
});
</script>
{% endblock %}
